<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="author" content="Amro Abdelqader">
        <meta name="keywords" content="HTML, Table">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
    </head>
    <body>
        <table border="2">
            <tr>
                <th>Name</th>
                <th>Age</th>
                <th>Height</th>
            </tr>
            <tr>
                <td>Ahmed</td>
                <td>20</td>
                <td>173</td>
            </tr>
            <tr>
                <td colspan="2">double col span</td>
                <td>A</td>
            </tr>
            <tr>
               <td rowspan="2">row span</td>
               <td>B</td> 
               <td>C</td>
            </tr>
            <tr>
                <td>f</td>
                <td>c</td>
            </tr>
        </table>
    </body>
</html>
